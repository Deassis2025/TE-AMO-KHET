<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Você foi meu Nocaute ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- CORAÇÕES -->
  <div class="hearts"></div>

  <!-- TOPO -->
  <div class="topo">
    <img src="Screenshot_20260106-220527_Video Player.jpg" alt="Foto especial">
  </div>

  <!-- CONTEÚDO -->
  <div class="conteudo">
    <h1>Você foi meu nocaute ❤️</h1>

    <p>
      Tem pessoas que chegam devagar…<br>
      Você chegou e virou tudo de uma vez.
    </p>

    <p>
      Não foi força, foi sentimento.<br>
      Não foi acaso, foi destino.
    </p>

    <div class="botoes">
      <button class="play" onclick="tocar()">▶️ Tocar</button>
      <button class="pause" onclick="pausar()">⏸️ Pausar</button>
    </div>

    <p class="frase-final">
      Se amar você é cair, eu caio toda vez… e nem quero levantar.
    </p>
  </div>

  <audio id="musica" src="Jorge & Mateus - Nocaute (Áudio Oficial) - Jorge & Mateus Oficial.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
